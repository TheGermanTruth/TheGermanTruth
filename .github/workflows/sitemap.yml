name: Generate XML Sitemap

on:
  push:
    branches:
      - main # Ersetzen Sie 'main' durch Ihren Standard-Branch, falls dieser anders heißt (z. B. 'master')

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://thegermantruth.github.io/TheGermanTruth/

      - name: Commit and Push Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated sitemap generation" && git push)

